name: Build Chai-1 Runtime Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Chai-1 image tag (e.g. 0.6.1)"
        required: true
        default: "0.6.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Security audit — verify zero secrets or research data in deploy/chai1
        run: |
          if grep -rnE '(rpa_|BEGIN OPENSSH|PRIVATE KEY|RUNPOD_API_KEY=|ghp_|github_pat_)' deploy/chai1/; then
            echo "FATAL: Disallowed secret pattern detected!"
            exit 1
          fi
          if find deploy/chai1/ -type f \( -name '*.cif' -o -name '*.pdb' -o -name '*.sdf' -o -name '*.fasta' -o -name '*.a3m' \) | grep -q .; then
            echo "FATAL: Research data file detected!"
            exit 1
          fi
          echo "Security audit PASSED."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/chai1-runtime" >> "$GITHUB_OUTPUT"

      # NOTE: Intentionally omit `cache-to: type=gha,mode=max` to avoid GHA 10 GB cache-export stalls!
      - name: Build and push Chai-1 runtime image to GHCR (with SBOM attestation)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/chai1
          file: ./deploy/chai1/Dockerfile
          push: true
          sbom: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ inputs.image_tag }}-${{ github.sha }}

      - name: Save immutable image digest manifest
        run: |
          mkdir -p build_reports
          echo "{\"image\": \"${{ steps.meta.outputs.image_name }}\", \"tag\": \"${{ inputs.image_tag }}\", \"digest\": \"${{ steps.build.outputs.digest }}\", \"immutable_ref\": \"${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}\", \"commit\": \"${{ github.sha }}\"}" > build_reports/image_digest.json
          cat build_reports/image_digest.json

      - name: Run Trivy vulnerability & secret scan on pushed immutable digest
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: json
          output: build_reports/trivy_scan.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SPDX SBOM JSON with Anchore Syft
        uses: anchore/sbom-action@v0.24.4
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: build_reports/sbom.spdx.json

      - name: Upload build manifest, SBOM, and Trivy scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chai1-runtime-${{ inputs.image_tag }}-reports
          path: build_reports/
          retention-days: 30
