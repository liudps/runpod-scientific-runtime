name: Build Boltz-2 Runtime Image (GHCR)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant to build"
        required: true
        default: "runtime"
        type: choice
        options:
          - runtime
          - full
      image_tag:
        description: "Tag suffix (e.g. 2.2.1)"
        required: true
        default: "2.2.1"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker system prune -af || true
          df -h

      - name: Security audit — verify zero secrets or research data in build context
        run: |
          if grep -rnE '(rpa_|BEGIN OPENSSH|PRIVATE KEY|RUNPOD_API_KEY=|ghp_|github_pat_)' deploy/boltz2/; then
            echo "FATAL: Disallowed secret pattern detected!"
            exit 1
          fi
          if find deploy/boltz2/ -type f \( -name '*.cif' -o -name '*.pdb' -o -name '*.sdf' -o -name '*.fasta' -o -name '*.a3m' \) | grep -q .; then
            echo "FATAL: Research structure/sequence file detected!"
            exit 1
          fi
          echo "Security audit PASSED."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image name and build args
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ inputs.variant }}" = "full" ]; then
            echo "image_name=ghcr.io/${OWNER_LOWER}/boltz2-full" >> "$GITHUB_OUTPUT"
            echo "include_weights=true" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=ghcr.io/${OWNER_LOWER}/boltz2-runtime" >> "$GITHUB_OUTPUT"
            echo "include_weights=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image to GHCR (with SBOM attestation)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/boltz2
          file: ./deploy/boltz2/Dockerfile
          push: true
          sbom: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ inputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ inputs.image_tag }}-${{ github.sha }}
          build-args: |
            INCLUDE_WEIGHTS=${{ steps.meta.outputs.include_weights }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM & Trivy Security Scan (on pushed immutable digest)
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
        run: |
          mkdir -p build_reports
          echo "{\"image\": \"${{ steps.meta.outputs.image_name }}\", \"tag\": \"${{ inputs.image_tag }}\", \"digest\": \"${{ steps.build.outputs.digest }}\", \"immutable_ref\": \"${IMAGE_REF}\", \"commit\": \"${{ github.sha }}\"}" > build_reports/image_digest.json
          cp deploy/boltz2/requirements.lock build_reports/requirements.lock

      - name: Run Trivy vulnerability & secret scan (JSON + table summary)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: json
          output: build_reports/trivy_scan.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SPDX SBOM JSON with Anchore Syft
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          image: ${{ steps.meta.outputs.image_name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: build_reports/sbom.spdx.json

      - name: Upload build manifest, SBOM, and security scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boltz2-${{ inputs.variant }}-${{ inputs.image_tag }}-reports
          path: build_reports/
          retention-days: 30

      - name: Print immutable image digest
        run: |
          echo "=== PUBLISHED IMMUTABLE IMAGE ==="
          cat build_reports/image_digest.json
